{% extends "Admin/Base.html" %}
{% block content %}
{% load static %}

<!-- Include SweetAlert for success messages -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% if messages %}
{% for message in messages %}
<script>
    Swal.fire({
        text: "{{ message }}",
        icon: "{% if message.tags == 'success' %}success{% else %}error{% endif %}"
    });
</script>
{% endfor %}
{% endif %}

<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card card-flush mb-5 p-4 shadow">
                        <div class="row mb-3">
                            <div class="col-lg-12">
                                <a href="javascript:history.back()" class="btn btn-secondary btn-sm">
                                    <i class="fa fa-arrow-left"></i> Back
                                </a>
                            </div>
                        </div>
                        <h5 class="my-2 bg-primary text-white p-2">Add Menu Content</h5>

                        <form action="" method="POST" enctype="multipart/form-data" class="form">
                            {% csrf_token %}

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="menu" class="form-label">Select menu:</label>
                                    <select name="menu" id="menu" class="form-control form-control-sm" required>
                                        <option value="">-- Select Menu --</option>
                                        {% for menu in menus %}
                                        <option value="{{ menu.id }}">{{ menu.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="submenu" class="form-label">Select Submenu:</label>
                                    <select name="submenu" id="submenu" class="form-control form-control-sm" required>
                                        <option value="">-- Select Submenu --</option>
                                        {% for submenu in submenus %}
                                        <option value="{{ submenu.id }}">{{ submenu.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="pagetitle" class="form-label">Page Title:</label>
                                    <input type="text" name="pagetitle" id="pagetitle"
                                        class="form-control form-control-sm" required>
                                </div>

                                <!-- <div class="col-md-6 mb-3">
                                    <label for="banner" class="form-label">Banner Image:</label>
                                    <input type="file" name="banner" id="banner" class="form-control form-control-sm">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="image" class="form-label">Content Image:</label>
                                    <input type="file" name="image" id="image" class="form-control form-control-sm">
                                </div> -->

                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Page Content:</label>
                                    <div id="editor" class="border p-2" style="height: 300px; background: #fff;"></div>
                                    <input type="hidden" name="pagecontent" id="pagecontent">
                                </div>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-success">Submit</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Quill.js Scripts -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var quill = new Quill("#editor", {
            theme: "snow",
            modules: {
                toolbar: [
                    [{ font: [] }],
                    [{ size: ["small", false, "large", "huge"] }],

                    [{ header: [1, 2, 3, 4, 5, 6, false] }],

                    ["bold", "italic", "underline", "strike"],

                    [{ color: [] }, { background: [] }],

                    [{ script: "sub" }, { script: "super" }],

                    [{ list: "ordered" }, { list: "bullet" }],
                    [{ indent: "-1" }, { indent: "+1" }],

                    [{ align: [] }],

                    ["blockquote", "code-block"],

                    ["link", "image", "video"],

                    ["clean"]
                ]
            }
        });

        console.log("✅ Quill.js Initialized");

        let form = document.querySelector("form");
        let hiddenInput = document.getElementById("pagecontent");

        // Ensure hidden input updates on Quill content change
        quill.on("text-change", function () {
            let content = quill.root.innerHTML.trim();
            hiddenInput.value = content;
            console.log("✅ Hidden input updated:", hiddenInput.value);
        });

        form.addEventListener("submit", function (event) {
            let content = quill.root.innerHTML.trim();
            hiddenInput.value = content; // Ensure value is updated

            console.log("✅ Form submitting with content:", hiddenInput.value);

            if (!content || content === "<p><br></p>") {
                event.preventDefault();
                Swal.fire({
                    text: "⚠️ Page content cannot be empty!",
                    icon: "error"
                });
                console.error("❌ Submission blocked: Empty content");
            }
        });
    });

    // this js use for condition either menu or submenu can be selected but not both
    document.addEventListener("DOMContentLoaded", function () {
        const menuselect = document.getElementById("menu");
        const submenuselect = document.getElementById("submenu");

        menuselect.addEventListener("change", function () {
            if (this.value) {
                submenuselect.value = "";
                submenuselect.disabled = true;
            } else {
                submenuselect.disabled = false;
            }
        });

        submenuselect.addEventListener("change", function () {
            if (this.value) {
                menuselect.value = "";
                menuselect.disabled = true;
            } else {
                menuselect.disabled = false;
            }
        });
    });
</script>

{% endblock %}
