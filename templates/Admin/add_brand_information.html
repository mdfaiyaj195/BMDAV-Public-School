{% extends "Admin/Base.html" %}
{% block content %}
{% load static %}

<!-- Include SweetAlert for success messages -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% if messages %}
    {% for message in messages %}
    <script>
        Swal.fire({
            text: "{{ message }}",
            icon: "{% if message.tags == 'success' %}success{% else %}error{% endif %}"
        });
    </script>
    {% endfor %}
{% endif %}

<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <div id="" class="">
                <div class="row gx-5 gx-xl-10">
                    
                    <div class="col-lg-12 col-md-12 col-12">
                        <div class="card card-flush mb-5" style="padding:10px; box-shadow: 0px 4px 4px gray;">
                            <div class="row">
                                <div class="col-lg-12 col-md-12 col-12">
                                    <a href="javascript:history.back()"><i class="fa fa-backward" aria-hidden="true"></i> Back</a>
                                </div>
                            </div>
                            <h5 style="margin-top:10px;" class="my-2 bg-success text-white p-2">Add Brand Information</h5>
                            
                            <form action="{% url 'brand-info' %}" method="post">
                                {% csrf_token %}
                                
                                <div class="row pt-2">
                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Brand Name</label>
                                        <input type="text" required class="form-control form-control-sm" placeholder="Enter Brand Name" name="brand_name">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>About Brand</label>
                                        <textarea required class="form-control form-control-sm" placeholder="Enter Brand Details" name="about_brand"></textarea>
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Email id</label>
                                        <input type="email" required class="form-control form-control-sm" placeholder="Enter Email" name="email">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Primary Phone</label>
                                        <input type="text" required class="form-control form-control-sm" placeholder="Enter Primary Phone" name="primary_phone">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Secondary Phone</label>
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter Secondary Phone" name="secondary_phone">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Address</label>
                                        <textarea required class="form-control form-control-sm" placeholder="Enter Address" name="address"></textarea>
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Facebook Link</label>
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter Facebook URL" name="fb_link">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>YouTube Link</label>
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter YouTube URL" name="yt_link">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Instagram Link</label>
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter Instagram URL" name="inst_link">
                                    </div>

                                    <div class="col-lg-6 col-md-6 col-12 mb-4">
                                        <label>Twitter Link</label>
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter Twitter URL" name="twitter_link">
                                    </div>

                                    <div class="col-lg-12 col-md-12 col-12 mb-4">
                                        <button type="submit" style="float: right; margin-right: 20px;" class="btn btn-info">Submit</button>
                                    </div>
                                </div>
                            </form>
                            
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
